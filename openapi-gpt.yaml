openapi: 3.1.0
info:
  title: Signal OS
  description: >
    You are my commitment tracker. When I tell you about something I
    need to do, promised someone, or need to follow up on, use Signal
    OS to log it. When I ask what's on my plate, query my open
    commitments. When I say something is done, close it.
    Rules: Always use Signal OS actions. When opening a commitment,
    extract title, person, urgency (NOW/SOON/SCHEDULED/SOMEDAY),
    channel_type (email/slack/meeting/call/text/web/other).
    When closing, try by title first; if ambiguous (409), show
    candidates and ask user to choose. Keep responses concise.
    When creating a commitment, check existing initiatives via
    GET /initiatives/list. If a match exists, confirm with the user
    then link via POST /initiatives/link. If no match, ask the user
    whether to create a new initiative or rethink the task.
    LIST RENDERING: For /tasks, what's open, show tasks,
    or ANY task listing request, call GET /tasks ONLY.
    NEVER call /commitments/open or any other endpoint to
    build a task list. The /tasks response is pre-formatted
    plain text. Display it EXACTLY as returned.
    Do NOT reformat, add prefixes like 'Initiative:',
    reorder, flatten sub-headers, or edit in any way.
    Never, under any circumstance, return the results in
    a copy box. NEVER fabricate tasks from memory.
    Language: "wanna" = "want to".
    "So now what's open?" = list open commitments.
    "Now it's open." = reopen most recently referenced commitment.
    If ambiguous, ask a clarifying question.
    Default assumption: the user is asking what's open.
  version: 0.2.0

servers:
  - url: https://signal-os-api-production.up.railway.app

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    CommitmentOpenRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          enum: [email, slack, meeting, call, text, web, other]
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        source_snippet:
          type: string
          nullable: true
        priority_order:
          type: integer
          nullable: true
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
          default: OPEN

    CommitmentCloseRequest:
      type: object
      properties:
        commitment_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        person:
          type: string
          nullable: true

    CommitmentUpdateRequest:
      type: object
      required: [commitment_id]
      properties:
        commitment_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
          nullable: true
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          enum: [email, slack, meeting, call, text, web, other]
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        source_snippet:
          type: string
          nullable: true
        priority_order:
          type: integer
          nullable: true

    CommitmentSetPriorityRequest:
      type: object
      required: [commitment_id, priority_order]
      properties:
        commitment_id:
          type: string
        priority_order:
          type: integer
          minimum: 1

    Commitment:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        source_snippet:
          type: string
          nullable: true
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        last_touched_at:
          type: string
          format: date-time
        priority_order:
          type: integer
          nullable: true
        days_open:
          type: number

    CommentCreateRequest:
      type: object
      required: [commitment_id, body]
      properties:
        commitment_id:
          type: string
        body:
          type: string
          minLength: 1
        author:
          type: string
          nullable: true

    Comment:
      type: object
      properties:
        id:
          type: string
        commitment_id:
          type: string
        body:
          type: string
        author:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ObjectiveCreateRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        year:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          default: ACTIVE

    ObjectiveUpdateRequest:
      type: object
      required: [objective_id]
      properties:
        objective_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          nullable: true

    Objective:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        year:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObjectiveLinkRequest:
      type: object
      required: [objective_id, commitment_id]
      properties:
        objective_id:
          type: string
        commitment_id:
          type: string
        rationale:
          type: string
          nullable: true

    ObjectiveLink:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        commitment_id:
          type: string
        rationale:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ObjectiveUpdateCreateRequest:
      type: object
      required: [objective_id, body]
      properties:
        objective_id:
          type: string
        body:
          type: string
          minLength: 1
        author:
          type: string
          nullable: true

    ObjectiveUpdateNote:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        body:
          type: string
        author:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ThemeCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          default: ACTIVE

    ThemeUpdateRequest:
      type: object
      required: [theme_id]
      properties:
        theme_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          nullable: true

    Theme:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ThemeSeedRequest:
      type: object
      required: [themes]
      properties:
        themes:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              description:
                type: string
                nullable: true
          minItems: 1

    InitiativeCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          default: ACTIVE
        theme_id:
          type: string
          nullable: true

    InitiativeUpdateRequest:
      type: object
      required: [initiative_id]
      properties:
        initiative_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          nullable: true
        theme_id:
          type: string
          nullable: true

    Initiative:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
        theme_id:
          type: string
          nullable: true
        theme_title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Memo:
      type: object
      properties:
        id:
          type: string
        week_start_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        author:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, FINALIZED, SENT]
        strategic_objective:
          type: string
          nullable: true
        current_priorities:
          type: array
          items:
            type: string
          nullable: true
        progress_summary:
          type: string
          nullable: true
        focus_next_week:
          type: array
          items:
            type: string
          nullable: true
        success_criteria:
          type: array
          items:
            type: string
          nullable: true
        lead_updates:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              role:
                type: string
              focus:
                type: string
              progress:
                type: array
                items:
                  type: string
              next_focus:
                type: array
                items:
                  type: string
        dashboard_snapshot:
          type: object
          nullable: true
          properties:
            top_focus:
              type: array
              items:
                type: string
            needs_decision:
              type: array
              items:
                type: string
            due_soon:
              type: array
              items:
                type: string
            active_workstreams:
              type: array
              items:
                type: string
        audience:
          type: array
          items:
            type: string
          nullable: true

    InitiativeSeedRequest:
      type: object
      required: [titles]
      properties:
        titles:
          type: array
          items:
            type: string
          minItems: 1

    InitiativeLinkRequest:
      type: object
      required: [initiative_id]
      properties:
        initiative_id:
          type: string
        commitment_id:
          type: string
          nullable: true
        commitment_title:
          type: string
          nullable: true
        rationale:
          type: string
          nullable: true

    InitiativeLink:
      type: object
      properties:
        id:
          type: string
        initiative_id:
          type: string
        commitment_id:
          type: string
        rationale:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time


paths:
  /tasks:
    get:
      operationId: getFormattedTaskList
      summary: Show all open tasks grouped and formatted
      description: >
        ALWAYS call this for /tasks, show tasks, what's open,
        or ANY listing request. Response is pre-formatted text.
        Display EXACTLY as returned — no changes, no prefixes,
        no flattening. NEVER build a task list from other endpoints.
      responses:
        "200":
          description: Pre-formatted markdown task list
          content:
            text/plain:
              schema:
                type: string

  /memo:
    get:
      operationId: getWeeklyMemo
      summary: Show the current week's leadership memo
      description: >
        ALWAYS call this for /memo, show memo, weekly memo,
        or ANY memo display request. Returns pre-formatted text.
        Display EXACTLY as returned. Auto-generates if none exists.
      responses:
        "200":
          description: Pre-formatted markdown memo
          content:
            text/plain:
              schema:
                type: string

  /commitments/open:
    post:
      operationId: openCommitment
      summary: Create a new commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentOpenRequest"
      responses:
        "200":
          description: Created commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/close:
    post:
      operationId: closeCommitment
      summary: Close a commitment by ID or title match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentCloseRequest"
      responses:
        "200":
          description: Closed commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "409":
          description: Multiple matches — provide commitment_id

  /commitments/update:
    post:
      operationId: updateCommitment
      summary: Update commitment fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentUpdateRequest"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"


  /commitments/set_priority:
    post:
      operationId: setCommitmentPriority
      summary: Set a commitment's priority position
      description: >
        Assigns priority_order (1 = top). Other items shift automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentSetPriorityRequest"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/comment:
    post:
      operationId: addComment
      summary: Add a comment to a commitment
      description: >
        Record a status update, meeting note, or context on a commitment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Commitment not found

  /commitments/comments:
    get:
      operationId: listComments
      summary: List all comments for a commitment
      parameters:
        - name: commitment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          description: Commitment not found

  /commitments/objectives:
    get:
      operationId: listObjectivesForCommitment
      summary: List objectives linked to a commitment
      parameters:
        - name: commitment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of objective links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectiveLink"

  /objectives/create:
    post:
      operationId: createObjective
      summary: Create a strategic objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveCreateRequest"
      responses:
        "200":
          description: Created objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"

  /objectives/update:
    post:
      operationId: updateObjective
      summary: Update an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveUpdateRequest"
      responses:
        "200":
          description: Updated objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "404":
          description: Objective not found

  /objectives/list:
    get:
      operationId: listObjectives
      summary: List strategic objectives
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
      responses:
        "200":
          description: List of objectives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"

  /objectives/get:
    get:
      operationId: getObjective
      summary: Get a single objective by ID
      parameters:
        - name: objective_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "404":
          description: Objective not found

  /objectives/link:
    post:
      operationId: linkCommitmentToObjective
      summary: Link a commitment to a strategic objective
      description: >
        Idempotent — relinking updates the rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveLinkRequest"
      responses:
        "200":
          description: Created or updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveLink"
        "404":
          description: Objective or commitment not found

  /objectives/update_note:
    post:
      operationId: addObjectiveUpdate
      summary: Add commentary/update to an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveUpdateCreateRequest"
      responses:
        "200":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveUpdateNote"
        "404":
          description: Objective not found

  /objectives/updates:
    get:
      operationId: listObjectiveUpdates
      summary: List all updates for an objective
      parameters:
        - name: objective_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectiveUpdateNote"

  /themes/create:
    post:
      operationId: createTheme
      summary: Create a new strategic theme
      description: >-
        Create a top-level strategic theme to group initiatives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeCreateRequest"
      responses:
        "200":
          description: Created theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"

  /themes/update:
    post:
      operationId: updateTheme
      summary: Update a strategic theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeUpdateRequest"
      responses:
        "200":
          description: Updated theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"
        "404":
          description: Theme not found

  /themes/list:
    get:
      operationId: listThemes
      summary: List strategic themes
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
      responses:
        "200":
          description: List of themes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Theme"

  /themes/get:
    get:
      operationId: getTheme
      summary: Get a single theme by ID
      parameters:
        - name: theme_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"
        "404":
          description: Theme not found

  /memos/generate:
    post:
      operationId: generateWeeklyMemo
      summary: Generate a weekly leadership alignment memo
      description: >-
        Pulls dashboard state, groups by platform lead, saves as draft.
        Call for /weekly-memo or generate memo requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                author:
                  type: string
                  nullable: true
                strategic_objective:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Generated memo draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memo"

  /initiatives/create:
    post:
      operationId: createInitiative
      summary: Create a new initiative
      description: >
        Create a strategic initiative to group commitments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeCreateRequest"
      responses:
        "200":
          description: Created initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"

  /initiatives/update:
    post:
      operationId: updateInitiative
      summary: Update an initiative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeUpdateRequest"
      responses:
        "200":
          description: Updated initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "404":
          description: Initiative not found

  /initiatives/list:
    get:
      operationId: listInitiatives
      summary: List all initiatives
      description: >
        Check existing initiatives before creating commitments.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
      responses:
        "200":
          description: List of initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Initiative"

  /initiatives/seed:
    post:
      operationId: seedInitiatives
      summary: Seed initiatives from a list of titles
      description: >-
        Creates initiatives that do not yet exist. Skips duplicates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeSeedRequest"
      responses:
        "200":
          description: Newly created initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Initiative"

  /initiatives/get:
    get:
      operationId: getInitiative
      summary: Get a single initiative by ID
      parameters:
        - name: initiative_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "404":
          description: Initiative not found

  /initiatives/link:
    post:
      operationId: linkCommitmentToInitiative
      summary: Link a commitment to an initiative
      description: >
        Provide commitment_id OR commitment_title (partial
        match). 409 if multiple matches. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeLinkRequest"
      responses:
        "200":
          description: Created or updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeLink"
        "404":
          description: Initiative or commitment not found

  /initiatives/links:
    get:
      operationId: listLinksForInitiative
      summary: List commitments linked to an initiative
      parameters:
        - name: initiative_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of commitment links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InitiativeLink"

  /memos/export-md:
    get:
      operationId: exportMemoMarkdown
      summary: Export memo as markdown (.md) file
      description: >-
        Returns the memo as a markdown document for download.
      parameters:
        - name: memo_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Markdown file
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Memo not found

  /memos/export-docx:
    get:
      operationId: exportMemoDocx
      summary: Export memo as Word (.docx) file
      description: >-
        Returns the memo as a .docx Word document for download.
      parameters:
        - name: memo_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Word document file
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          description: Memo not found
