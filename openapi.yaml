openapi: 3.1.0
info:
  title: Signal OS
  description: >
    Personal commitment log system — track, query, and get reminded about commitments.

    IMPORTANT INSTRUCTION FOR AI AGENTS: When the user asks to see their tasks,
    task list, to-do list, action items, commitments, or any variation of "show me
    my list", you MUST call GET /commitments/dashboard FIRST. This is the canonical,
    organized view of all open tasks. NEVER fabricate or recall tasks from memory.
    ALWAYS use the dashboard response as the single source of truth. Present every
    item returned — do not omit or skip any tasks.
  version: 0.1.0

servers:
  - url: https://signal-os-api-production.up.railway.app
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    CommitmentOpenRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 512
        description:
          type: string
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          enum: [email, slack, meeting, call, text, web, other]
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        source_snippet:
          type: string
          nullable: true
        priority_order:
          type: integer
          nullable: true
          description: Position in the overall priority list (1 = top priority)
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
          default: OPEN

    CommitmentCloseRequest:
      type: object
      properties:
        commitment_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        person:
          type: string
          nullable: true

    CommitmentUpdateRequest:
      type: object
      required: [commitment_id]
      properties:
        commitment_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
          nullable: true
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          enum: [email, slack, meeting, call, text, web, other]
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        source_snippet:
          type: string
          nullable: true
        priority_order:
          type: integer
          nullable: true
          description: Position in the overall priority list (1 = top priority)

    CommitmentSetPriorityRequest:
      type: object
      required: [commitment_id, priority_order]
      properties:
        commitment_id:
          type: string
        priority_order:
          type: integer
          minimum: 1
          description: Target position in the priority list (1 = top priority)

    Commitment:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, WAITING, SNOOZED, CLOSED]
        urgency:
          type: string
          enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
          nullable: true
        person:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        channel_type:
          type: string
          nullable: true
        channel_title:
          type: string
          nullable: true
        channel_link:
          type: string
          nullable: true
        source_snippet:
          type: string
          nullable: true
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        last_touched_at:
          type: string
          format: date-time
        priority_order:
          type: integer
          nullable: true
          description: Position in the overall priority list (1 = top priority)
        days_open:
          type: number

    CommentCreateRequest:
      type: object
      required: [commitment_id, body]
      properties:
        commitment_id:
          type: string
        body:
          type: string
          minLength: 1
          description: The comment text (status update, meeting note, etc.)
        author:
          type: string
          nullable: true
          description: Who wrote the comment

    Comment:
      type: object
      properties:
        id:
          type: string
        commitment_id:
          type: string
        body:
          type: string
        author:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ObjectiveCreateRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
          maxLength: 512
        description:
          type: string
          nullable: true
        year:
          type: integer
          minimum: 2000
          maximum: 2100
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          default: ACTIVE

    ObjectiveUpdateRequest:
      type: object
      required: [objective_id]
      properties:
        objective_id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
          nullable: true

    Objective:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        year:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObjectiveLinkRequest:
      type: object
      required: [objective_id, commitment_id]
      properties:
        objective_id:
          type: string
        commitment_id:
          type: string
        rationale:
          type: string
          nullable: true
          description: Why this action supports this objective

    ObjectiveLink:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        commitment_id:
          type: string
        rationale:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ObjectiveUpdateCreateRequest:
      type: object
      required: [objective_id, body]
      properties:
        objective_id:
          type: string
        body:
          type: string
          minLength: 1
          description: General update or commentary on the objective
        author:
          type: string
          nullable: true

    ObjectiveUpdateNote:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        body:
          type: string
        author:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    StatusReportCreateRequest:
      type: object
      required: [period_type, period_start, period_end, body]
      properties:
        period_type:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        body:
          type: string
          minLength: 1

    StatusReport:
      type: object
      properties:
        id:
          type: string
        period_type:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        body:
          type: string
        created_at:
          type: string
          format: date-time

    StatusDataRequest:
      type: object
      required: [period_type, period_start, period_end]
      properties:
        period_type:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time

    ReminderCreateRequest:
      type: object
      required: [commitment_id, remind_at]
      properties:
        commitment_id:
          type: string
        remind_at:
          type: string
          format: date-time
        message:
          type: string
          nullable: true
        delivery_target:
          type: string
          nullable: true
        delivery_channel:
          type: string
          default: whatsapp

    Reminder:
      type: object
      properties:
        id:
          type: string
        commitment_id:
          type: string
        remind_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivery_channel:
          type: string
        delivery_target:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: string

  /commitments/open:
    post:
      operationId: openCommitment
      summary: Create a new commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentOpenRequest"
      responses:
        "200":
          description: Created commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
    get:
      operationId: listOpenCommitments
      summary: List all open commitments
      responses:
        "200":
          description: List of open commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"

  /commitments/close:
    post:
      operationId: closeCommitment
      summary: Close a commitment by ID or title match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentCloseRequest"
      responses:
        "200":
          description: Closed commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "409":
          description: Multiple matches — provide commitment_id

  /commitments/update:
    post:
      operationId: updateCommitment
      summary: Update commitment fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentUpdateRequest"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/query:
    get:
      operationId: queryCommitments
      summary: Query commitments with filters
      parameters:
        - name: person
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, WAITING, SNOOZED, CLOSED]
        - name: urgency
          in: query
          schema:
            type: string
            enum: [INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY, ADMIN]
        - name: channel_type
          in: query
          schema:
            type: string
        - name: due_before
          in: query
          schema:
            type: string
            format: date-time
        - name: due_after
          in: query
          schema:
            type: string
            format: date-time
        - name: opened_before
          in: query
          schema:
            type: string
            format: date-time
        - name: opened_after
          in: query
          schema:
            type: string
            format: date-time
        - name: text
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"

  /commitments/set_priority:
    post:
      operationId: setCommitmentPriority
      summary: Set a commitment's position in the overall priority list
      description: >
        Assigns a priority_order to a commitment (1 = top priority).
        Other commitments are automatically shifted to maintain a
        contiguous ranking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentSetPriorityRequest"
      responses:
        "200":
          description: Updated commitment with new priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/priorities:
    get:
      operationId: listPriorities
      summary: List all open commitments ranked by priority order
      description: >
        Returns all non-CLOSED commitments that have a priority_order,
        sorted from highest priority (1) to lowest.
      responses:
        "200":
          description: Priority-ordered list of commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"

  /commitments/dashboard:
    get:
      operationId: getTaskDashboard
      summary: Get a comprehensive, organized view of all open tasks
      description: >
        CRITICAL INSTRUCTION FOR AI AGENTS: When the user asks to see their
        tasks, task list, to-do list, action items, commitments, or any
        variation of "show me my list" or "what's on my plate", you MUST
        call this endpoint. NEVER fabricate, guess, or recall tasks from
        memory. ALWAYS use the data returned by this endpoint as the single
        source of truth. Present EVERY item returned — do not omit,
        summarize away, or skip any tasks.


        Returns all non-CLOSED commitments organized into three sections:

        1. priority_ranked — Items with an explicit priority order, sorted
           by rank (1 = top). Show these FIRST under a "Top Priorities" heading.

        2. by_objective — Remaining items grouped by the strategic objective
           they are linked to. Show each objective title as a section header
           with its tasks beneath. Show these SECOND.

        3. ungrouped — Items with no priority and no linked objective,
           grouped by urgency level (INCIDENT, NOW, SOON, SCHEDULED, SOMEDAY,
           ADMIN, UNSET). Show these LAST.


        PRESENTATION RULES:

        - Always show the total_open count so the user can verify completeness.

        - Show priority_ranked items first with their rank numbers.

        - If by_objective groups exist, show each objective as a section header.

        - If no objectives exist, show ungrouped items by urgency labels.

        - NEVER add tasks that are not in this response.

        - NEVER omit tasks that are in this response.

        - Every task appears exactly once across all three sections.
      responses:
        "200":
          description: Organized task dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_open:
                    type: integer
                    description: Total count of non-closed commitments
                  priority_ranked:
                    type: array
                    description: Items with explicit priority order, sorted by rank
                    items:
                      $ref: "#/components/schemas/Commitment"
                  by_objective:
                    type: array
                    description: Items grouped by linked strategic objective
                    items:
                      type: object
                      properties:
                        objective_id:
                          type: string
                        objective_title:
                          type: string
                        objective_status:
                          type: string
                        commitments:
                          type: array
                          items:
                            $ref: "#/components/schemas/Commitment"
                  ungrouped:
                    type: array
                    description: Items with no priority/objective, grouped by urgency
                    items:
                      type: object
                      properties:
                        group_label:
                          type: string
                          description: Urgency level or UNSET
                        commitments:
                          type: array
                          items:
                            $ref: "#/components/schemas/Commitment"

  /commitments/comment:
    post:
      operationId: addComment
      summary: Add a comment to a commitment
      description: >
        Adds a timestamped comment to a commitment. Use this to record
        status updates, meeting notes, progress, or any context related
        to the commitment. Comments are preserved as history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "200":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Commitment not found

  /commitments/comments:
    get:
      operationId: listComments
      summary: List all comments for a commitment
      description: >
        Returns all comments for a commitment, ordered from oldest to
        newest. Use this to get the full history of updates on a
        commitment.
      parameters:
        - name: commitment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          description: Commitment not found

  /commitments/objectives:
    get:
      operationId: listObjectivesForCommitment
      summary: List all objectives linked to a commitment
      parameters:
        - name: commitment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of objective links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectiveLink"
        "404":
          description: Commitment not found

  /objectives/create:
    post:
      operationId: createObjective
      summary: Create a new strategic objective
      description: >
        Creates a strategic objective for a given year. Objectives
        represent annual goals that commitments (action items) drive
        toward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveCreateRequest"
      responses:
        "200":
          description: Created objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"

  /objectives/update:
    post:
      operationId: updateObjective
      summary: Update an objective's fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveUpdateRequest"
      responses:
        "200":
          description: Updated objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "404":
          description: Objective not found

  /objectives/list:
    get:
      operationId: listObjectives
      summary: List strategic objectives
      description: >
        Returns objectives optionally filtered by year and/or status.
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, DEFERRED, CANCELLED]
      responses:
        "200":
          description: List of objectives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"

  /objectives/get:
    get:
      operationId: getObjective
      summary: Get a single objective by ID
      parameters:
        - name: objective_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The objective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "404":
          description: Objective not found

  /objectives/link:
    post:
      operationId: linkCommitmentToObjective
      summary: Link a commitment (action item) to a strategic objective
      description: >
        Creates a link between a commitment and an objective, recording
        why this action supports the strategic goal. Idempotent — relinking
        updates the rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveLinkRequest"
      responses:
        "200":
          description: Created or updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveLink"
        "404":
          description: Objective or commitment not found

  /objectives/unlink:
    post:
      operationId: unlinkCommitmentFromObjective
      summary: Remove the link between a commitment and an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveLinkRequest"
      responses:
        "200":
          description: Link removed
        "404":
          description: Link not found

  /objectives/links:
    get:
      operationId: listLinksForObjective
      summary: List all commitments linked to an objective
      parameters:
        - name: objective_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of commitment links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectiveLink"
        "404":
          description: Objective not found

  /objectives/update_note:
    post:
      operationId: addObjectiveUpdate
      summary: Add general commentary/update to an objective
      description: >
        Adds a timestamped update note to an objective. Use this for
        general commentary not tied to a specific task, like meeting
        notes, market changes, or strategic observations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveUpdateCreateRequest"
      responses:
        "200":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveUpdateNote"
        "404":
          description: Objective not found

  /objectives/updates:
    get:
      operationId: listObjectiveUpdates
      summary: List all updates for an objective
      parameters:
        - name: objective_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectiveUpdateNote"
        "404":
          description: Objective not found

  /status/report:
    post:
      operationId: createStatusReport
      summary: Store a status report
      description: >
        Saves a generated status report (weekly, monthly, quarterly,
        or annual) with the body text. The body is typically composed
        by the AI from gathered status data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReportCreateRequest"
      responses:
        "200":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusReport"
    get:
      operationId: getStatusReport
      summary: Get a single status report by ID
      parameters:
        - name: report_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusReport"
        "404":
          description: Report not found

  /status/reports:
    get:
      operationId: listStatusReports
      summary: List status reports
      parameters:
        - name: period_type
          in: query
          schema:
            type: string
            enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusReport"

  /status/data:
    post:
      operationId: gatherStatusData
      summary: Gather all data needed to produce a status report
      description: >
        Returns structured data for a time period: objectives with
        linked commitments and their comments, objective updates,
        and commitment activity (opened/closed). Use this to compose
        a weekly, monthly, quarterly, or annual status narrative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusDataRequest"
      responses:
        "200":
          description: Aggregated status data
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_start:
                    type: string
                  period_end:
                    type: string
                  objectives:
                    type: array
                    items:
                      type: object
                  commitments_opened:
                    type: array
                    items:
                      type: object
                  commitments_closed:
                    type: array
                    items:
                      type: object

  /reminders/create:
    post:
      operationId: createReminder
      summary: Schedule a reminder for a commitment
      requestBody:
        required: true
        content:
          application/json:
